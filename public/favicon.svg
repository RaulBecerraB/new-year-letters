<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yellow flower favicon">
  <defs>
    <style>
      .petal { fill: #FFC83D; }
      .center { fill: #FFB300; }
    </style>
  </defs>

  <!-- 8 pétalos redondeados -->
  <g transform="translate(32 32)">
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(0)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(45)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(90)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(135)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(180)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(225)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(270)"/>
    <ellipse class="petal" cx="0" cy="-18" rx="7.5" ry="12" transform="rotate(315)"/>

    <!-- centro -->
    <circle class="center" r="9"/>
  </g>
</svg>
